# KickTick — Development Environment
# Usage: docker-compose up
#   Contracts: docker-compose run --rm contracts bash
#   Relayer:   docker-compose up relayer
#   Frontend:  docker-compose up frontend

services:
  contracts:
    build:
      context: ./kicktick
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        USER_NAME: ${USER_NAME:-builder}
    container_name: kicktick-contracts
    volumes:
      - ./kicktick:/workspace
      - ${HOME}/.config/solana:/home/${USER_NAME:-builder}/.config/solana
    working_dir: /workspace
    command: sleep infinity
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - ANCHOR_PROVIDER_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
    networks:
      - kicktick-net

  relayer:
    build:
      context: ./relayer
      dockerfile: Dockerfile
      target: dev
    container_name: kicktick-relayer
    ports:
      - "8080:8080"
    volumes:
      - ./relayer:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - contracts
    networks:
      - kicktick-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: kicktick-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - VITE_KICKTICK_PROGRAM_ID=${KICKTICK_PROGRAM_ID}
      - VITE_TXORACLE_PROGRAM_ID=${TXORACLE_PROGRAM_ID}
      - VITE_RELAYER_WS_URL=${RELAYER_WS_URL:-ws://localhost:8080}
    depends_on:
      - relayer
    networks:
      - kicktick-net

networks:
  kicktick-net:
    driver: bridge
