[package]
name = "kicktick"
version = "0.1.0"
description = "Sub-minute micro prediction markets with TxODDS settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kicktick"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
borsh = "1.5"
